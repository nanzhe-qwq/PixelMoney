<template>
  <style>
    @font-face {
      font-family: "Deng";
      src: url("assets/fonts/DengXian-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Deng";
      src: url("assets/fonts/DengXian-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .hk-layer {
      position: absolute;
      inset: 0;
    }
    .hk-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(1200px 760px at 71% 42%, rgba(255, 215, 0, 0.17), transparent 62%),
        radial-gradient(820px 600px at 8% 92%, rgba(78, 204, 163, 0.09), transparent 64%),
        #12121f;
    }
    .hk-grid {
      position: absolute;
      inset: -10%;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
      background-size: 64px 64px;
      opacity: 0.55;
    }
    .hk-copy {
      position: absolute;
      left: 132px;
      top: 286px;
      width: 880px;
    }
    .hk-eyebrow {
      font-family: "Space Mono", monospace;
      font-size: 30px;
      letter-spacing: 0.3em;
      color: #ffd700;
      margin-bottom: 40px;
    }
    .hk-l1,
    .hk-l2 {
      font-family: "Deng";
      font-weight: 700;
      font-size: 102px;
      line-height: 1.14;
      letter-spacing: 0.01em;
    }
    .hk-l1 {
      color: #eaeaea;
    }
    .hk-l2 {
      color: #ffd700;
    }
    .hk-bar {
      width: 128px;
      height: 8px;
      background: #e94560;
      margin-top: 46px;
    }
    .hk-phone {
      position: absolute;
      right: 152px;
      top: 68px;
      width: 423px;
      height: 940px;
    }
    .hk-phone img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow:
        0 56px 120px rgba(0, 0, 0, 0.62),
        0 0 0 1px rgba(255, 215, 0, 0.1);
    }
  </style>

  <div id="root" data-composition-id="hook" data-width="1920" data-height="1080">
    <div id="hook-layer" class="hk-layer clip" data-start="0" data-duration="4.6">
      <div class="hk-bg"></div>
      <div class="hk-grid"></div>

      <div class="hk-copy">
        <div class="hk-copy-in">
          <div class="hk-eyebrow">PIXEL MONEY · v4.4.2</div>
          <div class="hk-l1">花完钱的那一秒</div>
          <div class="hk-l2">才是记账的时机</div>
          <div class="hk-bar"></div>
        </div>
      </div>

      <div class="hk-phone">
        <div class="hk-phone-in">
          <img src="assets/shots/home.png" alt="像素记账首页" />
        </div>
      </div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    tl.fromTo(".hk-grid", { opacity: 0 }, { opacity: 0.55, duration: 1.5, ease: "power2.out" }, 0);

    /* 首帧就要有内容：手机与眉标在 0s 已可见，入场只做位移与推近。 */
    tl.fromTo(
      ".hk-phone-in",
      { y: 26, rotate: 2.4 },
      { y: 0, rotate: 0, duration: 1.25, ease: "power3.out" },
      0,
    );
    tl.fromTo(".hk-phone-in", { scale: 1 }, { scale: 1.045, duration: 3.3, ease: "none" }, 1.25);

    tl.fromTo(
      ".hk-eyebrow",
      { x: -22, opacity: 0.55 },
      { x: 0, opacity: 1, duration: 0.9, ease: "power3.out" },
      0,
    );
    tl.fromTo(
      ".hk-l1",
      { y: 40, opacity: 0, filter: "blur(12px)" },
      { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.88, ease: "power3.out" },
      0.58,
    );
    tl.fromTo(
      ".hk-l2",
      { y: 40, opacity: 0, filter: "blur(12px)" },
      { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.88, ease: "power3.out" },
      0.98,
    );
    tl.fromTo(
      ".hk-bar",
      { scaleX: 0, transformOrigin: "left center" },
      { scaleX: 1, duration: 0.52, ease: "power2.out" },
      1.54,
    );

    window.__timelines["hook"] = tl;
  </script>
</template>
