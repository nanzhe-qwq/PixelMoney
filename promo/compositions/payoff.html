<template>
  <style>
    @font-face {
      font-family: "Deng";
      src: url("assets/fonts/DengXian-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Deng";
      src: url("assets/fonts/DengXian-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .py-layer {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(920px 680px at 74% 48%, rgba(255, 215, 0, 0.15), transparent 63%),
        #0d0e19;
    }
    .py-phone {
      position: absolute;
      right: 150px;
      top: 108px;
      width: 387px;
      height: 860px;
    }
    .py-phone img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: 0 54px 118px rgba(0, 0, 0, 0.66);
    }
    .py-copy {
      position: absolute;
      left: 140px;
      top: 300px;
      width: 900px;
    }
    .py-kicker {
      font-family: "Space Mono", monospace;
      font-size: 30px;
      letter-spacing: 0.3em;
      color: #ffd700;
      margin-bottom: 26px;
    }
    .py-h {
      font-family: "Deng";
      font-weight: 700;
      font-size: 118px;
      line-height: 1.1;
      color: #eaeaea;
    }
    .py-n1 {
      color: #ffd700;
      font-variant-numeric: tabular-nums;
    }
    .py-sub {
      font-family: "Space Mono", monospace;
      font-size: 30px;
      letter-spacing: 0.1em;
      color: #9ba0b8;
      margin-top: 44px;
    }
    .py-bar {
      width: 96px;
      height: 6px;
      background: #4ecca3;
      margin-top: 40px;
    }
  </style>

  <div id="root" data-composition-id="payoff" data-width="1920" data-height="1080">
    <div id="payoff-layer" class="py-layer clip" data-start="0" data-duration="4.2">
      <div class="py-phone">
        <div class="py-phone-in">
          <img src="assets/shots/profile.png" alt="我的页面：记账天数、总笔数与连续天数" />
        </div>
      </div>

      <div class="py-copy">
        <div class="py-copy-in">
          <div class="py-kicker">坚持</div>
          <div class="py-h">记了 <span class="py-n1">0</span> 天，<br />一天没漏</div>
          <div class="py-sub">180 笔账 · 连续 80 天</div>
          <div class="py-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const counter = { days: 0 };

    tl.fromTo(
      ".py-phone-in",
      { x: 80, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.78, ease: "power3.out" },
      0,
    );
    tl.fromTo(
      ".py-kicker",
      { opacity: 0, y: 14 },
      { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" },
      0.18,
    );
    tl.fromTo(
      ".py-h",
      { y: 34, opacity: 0, filter: "blur(10px)" },
      { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out" },
      0.3,
    );
    tl.fromTo(
      counter,
      { days: 0 },
      {
        days: 91,
        duration: 1.15,
        ease: "power2.out",
        onUpdate: () => {
          document.querySelector(".py-n1").textContent = String(Math.round(counter.days));
        },
      },
      0.44,
    );
    tl.fromTo(
      ".py-sub",
      { opacity: 0, y: 16 },
      { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
      1.5,
    );
    tl.fromTo(
      ".py-bar",
      { scaleX: 0, transformOrigin: "left center" },
      { scaleX: 1, duration: 0.45, ease: "power2.out" },
      1.72,
    );

    window.__timelines["payoff"] = tl;
  </script>
</template>
